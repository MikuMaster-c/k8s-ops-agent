# 对应 eval/cases.jsonl 里 c13–c16 四条 incident 用例的 Pod 名。
# 用例里写死了 pod 名，所以这里必须用同样的名字，否则 agent 查不到东西，
# 评测失败反映的就只是环境缺失，而不是模型能力。
# 全部复用已 load 进 kind 的 agent-ops 镜像，避免再拉镜像。
apiVersion: v1
kind: Pod
metadata:
  name: web-7d9
  labels: { chaos: "true" }
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: agent-ops:0.1.0
      imagePullPolicy: IfNotPresent
      # 立即退出 → 反复重启 → CrashLoopBackOff（坑一）
      command: ["python", "-c", "import sys; sys.exit(1)"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: api-2b1
  labels: { chaos: "true" }
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: agent-ops:0.1.0
      imagePullPolicy: IfNotPresent
      # 分配 300Mi，超过 limits.memory → OOMKilled（坑二）
      command: ["python", "-c", "x = bytearray(300*1024*1024)"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: job-4c8
  labels: { chaos: "true" }
spec:
  restartPolicy: Never
  containers:
    - name: job
      # 不存在的仓库 → ErrImagePull / ImagePullBackOff
      image: registry.invalid.example/agent-ops:9.9.9
      imagePullPolicy: Always
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-9a2
  labels: { chaos: "true" }
spec:
  restartPolicy: Always
  containers:
    - name: worker
      image: agent-ops:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      # 探一个永远不通的端口 → 启动探针失败 → 反复重启（坑一的正向版本）
      startupProbe:
        httpGet: { path: /healthz, port: 9999 }
        periodSeconds: 2
        failureThreshold: 3
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 128Mi }
